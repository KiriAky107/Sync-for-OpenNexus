[project]
name = "notesagent-sync"
version = "0.4.0a1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn>=0.35,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "boto3>=1.40,<2", "pydantic>=2.11,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
