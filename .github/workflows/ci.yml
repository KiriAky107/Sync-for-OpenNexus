name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
concurrency:
  group: sync-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the fixed Desktop contract fixture
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/OpenNexus
          ref: bbea7992f2af4ea3b05b2dd0faa39a419a2629fb
          path: .contract-desktop
          persist-credentials: false
          sparse-checkout: frontend/src-tauri/tests/fixtures/sync-v1-contract.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - name: Verify the shared contract and local documentation policy
        run: |
          uv run --frozen python - <<'PY'
          from pathlib import Path
          import subprocess
          desktop = Path('.contract-desktop')
          assert Path('tests/fixtures/sync-v1-contract.json').read_bytes() == (desktop / 'frontend/src-tauri/tests/fixtures/sync-v1-contract.json').read_bytes(), 'Sync and Desktop protocol fixtures differ'
          private = ('docs/', 'documents/', 'frontend/docs/', '.local-plans/')
          for repo in (Path('.'), desktop):
              paths = subprocess.check_output(['git', 'ls-files', '-z'], cwd=repo).decode('utf-8').split('\0')
              assert not any(path.casefold().startswith(private) for path in paths), 'Private documentation must stay local'
          PY
      - run: uv run --frozen pytest -q

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: corepack enable
      - run: corepack prepare pnpm@10.28.0 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: sync-console-${{ github.sha }}
          path: sync_server/static
          if-no-files-found: error

  production-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYNC_OPERATIONS_PROBE: '1'
      SYNC_OPERATIONS_PROBE_DATABASE_URL: postgresql+psycopg://postgres:controlled-probe-password@127.0.0.1:15432/postgres
      SYNC_OPERATIONS_PROBE_S3_ENDPOINT: http://127.0.0.1:19000
      AWS_ACCESS_KEY_ID: controlled-probe
      AWS_SECRET_ACCESS_KEY: controlled-probe-password
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      MINIO_ROOT_USER: controlled-probe
      MINIO_ROOT_PASSWORD: controlled-probe-password
    services:
      database:
        image: postgres:17.6
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: controlled-probe-password
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read the fixed release tools
        uses: actions/checkout@v7
        with:
          repository: KiriAky107/OpenNexus
          ref: 276b449c27c079474c9d978fe633ff28b53b1c7b
          path: .build/release-tools
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --frozen
      - name: Build the verified official S3 provider source
        run: docker build --file Dockerfile.objects --tag opennexus-objects:probe .
      - name: Start the owned S3 dependency
        run: >-
          docker run --detach --name sync-operations-s3
          --publish 127.0.0.1:19000:9000
          --env MINIO_ROOT_USER --env MINIO_ROOT_PASSWORD
          opennexus-objects:probe server /data
      - name: Verify the fixed deployment ZIP with real providers and the production CLI
        run: uv run --frozen python .build/release-tools/scripts/build_service_release.py --kind sync --commit "$GITHUB_SHA" --output .build/service-release
      - name: Preserve the sanitized operation result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-production-operations-${{ github.sha }}
          path: .build/service-release/probe/result.json
          if-no-files-found: warn
      - name: Preserve the deployment archive and its exact verification receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-deploy-${{ github.sha }}
          path: |
            .build/service-release/*_deploy.zip
            .build/service-release/verification.json
          if-no-files-found: warn
          compression-level: 0
      - name: Stop only the owned S3 dependency
        if: always()
        run: docker rm --force sync-operations-s3
